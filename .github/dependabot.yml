# Mantiene al día las versiones de las GitHub Actions (checkout, setup-node…).
# El sitio no tiene dependencias de npm; si algún día las tiene, agregar el ecosistema "npm".
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    labels: [dependencias]
    commit-message:
      prefix: "CI"
