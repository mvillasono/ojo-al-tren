# Mantiene al día las versiones de las GitHub Actions (checkout, setup-node…).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    labels: [dependencias]
    commit-message:
      prefix: "CI"
  # pg (la API)
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    labels: [dependencias]
