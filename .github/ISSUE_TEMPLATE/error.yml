name: Algo no funciona
description: Un error en el mapa, en los reportes o en cómo se ve la página.
title: "[Error] "
labels: ["error"]
body:
  - type: textarea
    id: que
    attributes:
      label: ¿Qué pasó?
      description: Cuéntalo como se lo contarías a alguien en el tren.
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: ¿Qué esperabas que pasara?
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para que vuelva a pasar
      placeholder: |
        1. Abrí la página en el celular
        2. Toqué «Reportar»
        3. …
  - type: dropdown
    id: dispositivo
    attributes:
      label: ¿Dónde lo viste?
      options: [Celular Android, iPhone, Computadora, Otro]
  - type: input
    id: navegador
    attributes:
      label: Navegador (si lo sabes)
      placeholder: Chrome, Safari, Firefox…
  - type: textarea
    id: capturas
    attributes:
      label: Capturas de pantalla
      description: Si puedes, adjunta una. Revisa que no muestre datos personales.
